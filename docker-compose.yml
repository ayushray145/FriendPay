services:
  postgres:
    image: postgres:17-alpine
    container_name: split-ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: splitledger
      POSTGRES_USER: splitledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splitledger_dev}
    ports:
      - "5432:5432"
    volumes:
      - split-ledger-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitledger -d splitledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  split-ledger-postgres-data:
